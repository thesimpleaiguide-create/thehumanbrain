<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Visualizer Video Overlay</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            overflow: hidden;
            background-color: #06090e;
        }

        /* Glassmorphism Badge styling */
        .glass-badge {
            background: rgba(8, 12, 20, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 112, 40, 0.8);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 112, 40, 0.4);
        }

        /* Callout label positioning animation */
        .callout-badge {
            transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pulse-dot {
            animation: pulseDot 1.2s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 1; box-shadow: 0 0 16px #FF7028; }
        }
    </style>
</head>
<body class="h-full w-full relative flex items-center justify-center bg-slate-950">

    <div class="relative w-full h-full flex items-center justify-center overflow-hidden">
        
        <!-- Video element playing continuously and muted -->
        <video id="brain-video" playsinline autoplay loop muted crossorigin="anonymous" class="w-full h-full object-contain">
            <source src="video.mp4" type="video/mp4">
            <source src="Camera_rotating_around_brain_model_202608021415.mp4" type="video/mp4">
        </video>

        <!-- Callouts Container -->
        <div id="callout-container" class="absolute inset-0 pointer-events-none flex items-center justify-center">
            
            <!-- 1. RATIONAL BRAIN (Prefrontal Cortex) Popup -->
            <div id="pfc-callout" class="callout-badge absolute opacity-0 scale-90 transition-all duration-300" style="top: 15%; left: 10%;">
                <div class="glass-badge px-4 py-3 sm:px-6 sm:py-4 rounded-2xl flex items-center gap-3 border-2 border-orange-500">
                    <div class="relative flex items-center justify-center shrink-0">
                        <span class="pulse-dot w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-orange-500"></span>
                    </div>
                    <div>
                        <div class="text-[11px] sm:text-xs font-mono tracking-widest text-orange-400 font-black uppercase">HIGHLIGHTED REGION</div>
                        <div class="text-base sm:text-xl md:text-2xl font-black text-white tracking-wide leading-tight drop-shadow-md">
                            RATIONAL BRAIN
                            <span class="block text-xs sm:text-sm md:text-base text-orange-300 font-bold font-mono">(Prefrontal Cortex)</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. SURVIVAL BRAIN (Amygdala) Popup -->
            <div id="amy-callout" class="callout-badge absolute opacity-0 scale-90 transition-all duration-300" style="bottom: 15%; right: 10%;">
                <div class="glass-badge px-4 py-3 sm:px-6 sm:py-4 rounded-2xl flex items-center gap-3 border-2 border-orange-500">
                    <div class="relative flex items-center justify-center shrink-0">
                        <span class="pulse-dot w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-orange-500"></span>
                    </div>
                    <div>
                        <div class="text-[11px] sm:text-xs font-mono tracking-widest text-orange-400 font-black uppercase">HIGHLIGHTED REGION</div>
                        <div class="text-base sm:text-xl md:text-2xl font-black text-white tracking-wide leading-tight drop-shadow-md">
                            SURVIVAL BRAIN
                            <span class="block text-xs sm:text-sm md:text-base text-orange-300 font-bold font-mono">(Amygdala)</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const video = document.getElementById('brain-video');
        const pfcCallout = document.getElementById('pfc-callout');
        const amyCallout = document.getElementById('amy-callout');

        // Monitor video time to show labels strictly when regions highlight
        video.addEventListener('timeupdate', () => {
            const t = video.currentTime;

            // Prefrontal Cortex Highlight (00:01.0 to 00:03.5)
            if (t >= 1.0 && t <= 3.5) {
                pfcCallout.classList.remove('opacity-0', 'scale-90');
                pfcCallout.classList.add('opacity-100', 'scale-100');
            } else {
                pfcCallout.classList.remove('opacity-100', 'scale-100');
                pfcCallout.classList.add('opacity-0', 'scale-90');
            }

            // Amygdala Highlight (00:04.0 to 00:06.5)
            if (t >= 4.0 && t <= 6.5) {
                amyCallout.classList.remove('opacity-0', 'scale-90');
                amyCallout.classList.add('opacity-100', 'scale-100');
            } else {
                amyCallout.classList.remove('opacity-100', 'scale-100');
                amyCallout.classList.add('opacity-0', 'scale-90');
            }
        });

        // Ensure video plays silently on load
        window.addEventListener('load', () => {
            video.muted = true;
            video.play().catch(() => {});
        });
    </script>
</body>
</html>
